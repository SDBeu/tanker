<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f59e0b" />
  <meta name="description" content="Tanker — vind de goedkoopste tankstations in de buurt" />
  <title>Tanker</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>
      <svg class="header-logo" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M50 5 C50 5 10 55 10 75 C10 97 28 115 50 115 C72 115 90 97 90 75 C90 55 50 5 50 5Z" fill="#f59e0b"/>
        <ellipse cx="38" cy="52" rx="7" ry="11" fill="rgba(255,255,255,0.25)" transform="rotate(-20 38 52)"/>
        <text x="50" y="95" text-anchor="middle" font-size="38" font-weight="700" fill="#0f172a" font-family="sans-serif">€</text>
      </svg>
      Tanker
    </h1>
    <div id="savings-display" class="hidden">
      <span id="savings-can"></span>
      <input type="number" id="tank-liters" value="50" min="1" max="999">
      <span class="savings-unit">L</span>
      <span id="savings-amount"></span>
    </div>
  </header>

  <nav id="tabs">
    <button class="tab-btn active" data-tab="route">Langs route</button>
    <button class="tab-btn" data-tab="nearby">In de buurt</button>
  </nav>

  <!-- Tab: in de buurt -->
  <div id="tab-nearby" class="tab-panel hidden">
    <div class="sidebar">
      <div id="controls">
        <div class="input-row">
          <div class="input-wrap">
            <input type="text" id="nearby-location" placeholder="Adres of stad..." autocomplete="off" />
            <button class="clear-btn" type="button" aria-label="Wissen">&#xd7;</button>
          </div>
          <button id="nearby-gps-btn" title="Gebruik mijn locatie">&#9678;</button>
        </div>
      </div>
      <div id="fuel-btns"></div>
      <div id="sort-btns"></div>
      <div id="nearby-meta">
        <div id="status"></div>
        <div id="nearby-view-toggle" class="hidden"></div>
      </div>
      <div id="nearby-price-slider" class="price-slider-wrap hidden"></div>
      <div id="list" class="hidden"></div>
    </div>
    <div class="sidebar-resizer"></div>
    <div id="nearby-map" class="map-container"></div>
  </div>

  <!-- Tab: route -->
  <div id="tab-route" class="tab-panel">
    <div class="sidebar">
      <div id="route-form">
        <div id="route-form-fields">
          <div class="field">
            <label for="route-start">Vertrek</label>
            <div class="input-row">
              <div class="input-wrap">
                <input type="text" id="route-start" placeholder="Adres of stad..." autocomplete="off" />
                <button class="clear-btn" type="button" aria-label="Wissen">&#xd7;</button>
              </div>
              <button id="use-gps-btn" title="Gebruik mijn locatie">&#9678;</button>
            </div>
          </div>
          <div class="field">
            <label for="route-end">Bestemming</label>
            <div class="input-wrap">
              <input type="text" id="route-end" placeholder="Adres of stad..." autocomplete="off" />
              <button class="clear-btn" type="button" aria-label="Wissen">&#xd7;</button>
            </div>
          </div>
          <button id="calc-route-btn">Bereken route</button>
        </div>
        <div id="route-form-summary" class="hidden">
          <span id="route-summary-text"></span>
          <button id="route-edit-btn" title="Route aanpassen">Wijzig</button>
        </div>
      </div>
      <div id="route-fuel-btns"></div>
      <div id="route-meta">
        <div id="route-status"></div>
        <div id="route-info"></div>
        <div id="route-view-toggle" class="hidden"></div>
      </div>
      <div id="route-sort-btns" class="hidden"></div>
      <div id="route-price-slider" class="price-slider-wrap hidden"></div>
      <div id="route-list" class="hidden"></div>
    </div>
    <div class="sidebar-resizer"></div>
    <div id="route-map" class="map-container"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/app.js"></script>
</body>
</html>
